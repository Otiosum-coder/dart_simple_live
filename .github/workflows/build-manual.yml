name: build-manual

# 两种触发方式：
#   1) 手动触发（workflow_dispatch）：勾选需要的平台，产物只上传到 Artifacts（不创建 Release）
#   2) 推送 tag（v*）          ：构建全部平台，并自动创建/更新 Release 并上传产物
#
# 各平台说明：
#   Android  ：正式签名（需配置 KEYSTORE_BASE64 等 secrets，否则为 debug 签名）
#   Windows  ：预下载 mpv/ANGLE 运行库，规避 CI 上下载抖动；固定 windows-2022 规避 VS18 的 C2338
#   Linux    ：需要系统 libmpv；产物为 zip
#   macOS    ：arm64 产物（macos-latest），未公证，首次打开需右键 → 打开
#   iOS      ：未签名 ipa，需用 AltStore / Sideloadly 等工具自签安装
on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "构建 Android APK"
        type: boolean
        default: true
      build_windows:
        description: "构建 Windows (EXE)"
        type: boolean
        default: true
      build_linux:
        description: "构建 Linux (zip)"
        type: boolean
        default: false
      build_macos:
        description: "构建 macOS (arm64 zip)"
        type: boolean
        default: false
      build_ios:
        description: "构建 iOS（未签名 ipa）"
        type: boolean
        default: false
  push:
    tags: ["v*"]

# 打 tag 时需要创建 Release 并上传产物
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Android APK
  build-apk:
    if: ${{ github.event_name == 'push' || inputs.build_apk }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          V=$(grep -m1 '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=${V:-dev}" >> "$GITHUB_OUTPUT"
          echo "本次版本：${V:-dev}"

      # 签名密钥（可选）：配置了 KEYSTORE_BASE64 等 secrets 才启用，否则构建出的是 debug 签名包
      # 注意：step 的 if 里不能可靠地引用 secrets，所以这里统一走 env + bash 判断
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64/STORE_PASSWORD/KEY_PASSWORD/KEY_ALIAS，本次 APK 会用 debug 签名，无法覆盖安装已发布的正式包"
            exit 0
          fi
          # storeFile 必须是绝对路径：build.gradle.kts 里用 file(it) 解析，相对的是 android/app 目录
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/simple_live_app/android/app/keystore.jks"
          cat > "$GITHUB_WORKSPACE/simple_live_app/android/key.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/simple_live_app/android/app/keystore.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          echo "已写入签名配置（alias=$KEY_ALIAS）"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: 拉依赖
        run: |
          cd simple_live_app
          flutter pub get

      - name: 构建 APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      - name: 规范化产物名
        run: |
          cd simple_live_app/build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app-$abi-release.apk" "SimpleLive-${{ steps.version.outputs.VERSION }}-$abi.apk"
          done

      - name: 上传 APK（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.VERSION }}
          path: simple_live_app/build/app/outputs/flutter-apk/SimpleLive-*.apk
          if-no-files-found: error

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" simple_live_app/build/app/outputs/flutter-apk/SimpleLive-*.apk --clobber

  # ------------------------------------------------------------- Windows EXE
  build-windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    # 固定到 windows-2022（VS 2022，与本地一致）：windows-latest 已升级到 VS 18/MSVC 14.51，
    # 把 <experimental/coroutine> 从警告变成硬错误，permission_handler_windows 等插件会编译失败
    runs-on: windows-2022
    env:
      # 1) 插件源码里有中文注释，非 UTF-8 代码页下 /WX 会把 C4819 升级成 C2220 编译失败
      # 2) 兼容 VS18 对 experimental/coroutine 的硬错误（官方给的开关）
      CL: /utf-8 /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      # 双保险：CMake 会读取 CXXFLAGS 并并入 CMAKE_CXX_FLAGS
      CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          V=$(grep -m1 '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=${V:-dev}" >> "$GITHUB_OUTPUT"
          echo "本次版本：${V:-dev}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: 打开 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 拉依赖
        run: |
          cd simple_live_app
          flutter pub get

      # 插件（media_kit_libs_windows_video）在 CMake 阶段要从 GitHub 下载 mpv + ANGLE 并校验 MD5，
      # 这是 CI 上最容易失败的一步。插件逻辑是「文件存在且 MD5 匹配就跳过下载」，所以先自己下好。
      - name: 预下载 mpv / ANGLE 运行库
        shell: pwsh
        run: |
          $dir = "simple_live_app/build/windows/x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $items = @(
            @{ n = "mpv-dev-x86_64-20230924-git-652a1dd.7z"
               u = "https://github.com/media-kit/libmpv-win32-video-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z"
               md5 = "A832EF24B3A6FF97CD2560B5B9D04CD8" },
            @{ n = "ANGLE.7z"
               u = "https://github.com/alexmercerind/flutter-windows-ANGLE-OpenGL-ES/releases/download/v1.0.1/ANGLE.7z"
               md5 = "E866F13E8D552348058AFAAFE869B1ED" }
          )
          foreach ($it in $items) {
            $out = Join-Path $dir $it.n
            $ok = (Test-Path $out) -and ((Get-FileHash $out -Algorithm MD5).Hash -eq $it.md5)
            if ($ok) { Write-Output "$($it.n) 已存在且校验通过"; continue }
            for ($i = 1; $i -le 5; $i++) {
              Write-Output "下载 $($it.n) 第 $i 次..."
              curl.exe -L --fail --retry 3 --retry-delay 2 -o $out $it.u
              if ((Test-Path $out) -and ((Get-FileHash $out -Algorithm MD5).Hash -eq $it.md5)) { break }
              Start-Sleep -Seconds 3
            }
            $actual = if (Test-Path $out) { (Get-FileHash $out -Algorithm MD5).Hash } else { "文件不存在" }
            if ($actual -ne $it.md5) { throw "$($it.n) 校验失败：期望 $($it.md5)，实际 $actual" }
            Write-Output "$($it.n) 下载完成并校验通过"
          }

      - name: 构建 Windows Release
        shell: pwsh
        run: |
          cd simple_live_app
          for ($i = 1; $i -le 2; $i++) {
            flutter build windows --release
            if ($LASTEXITCODE -eq 0) { Write-Output "构建成功"; exit 0 }
            Write-Output "第 $i 次构建失败，清理 CMake 缓存后重试"
            Remove-Item "build\windows\x64\CMakeCache.txt" -Force -ErrorAction SilentlyContinue
          }
          exit 1

      - name: 打包为 zip（exe + 全部依赖 DLL，解压即用）
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $src = "simple_live_app/build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "构建产物不存在：$src" }
          $zip = "SimpleLive-$ver-windows-x64.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传 Windows（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ steps.version.outputs.VERSION }}
          path: SimpleLive-*-windows-x64.zip
          if-no-files-found: error

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          gh release view $tag 2>$null | Out-Null; if ($LASTEXITCODE -ne 0) { gh release create $tag --generate-notes --title $tag }
          gh release upload $tag (Get-ChildItem "SimpleLive-*-windows-x64.zip").FullName --clobber

  # ---------------------------------------------------------------- Linux
  build-linux:
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          V=$(grep -m1 '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=${V:-dev}" >> "$GITHUB_OUTPUT"

      # media_kit 在 Linux 上用系统 libmpv，必须装齐桌面构建依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: 打开 Linux 桌面支持
        run: flutter config --enable-linux-desktop

      - name: 拉依赖
        run: |
          cd simple_live_app
          flutter pub get

      - name: 构建 Linux
        run: |
          cd simple_live_app
          flutter build linux --release

      - name: 打包为 zip
        run: |
          cd simple_live_app/build/linux/x64/release
          zip -r "SimpleLive-${{ steps.version.outputs.VERSION }}-linux-x64.zip" bundle

      - name: 上传 Linux（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ steps.version.outputs.VERSION }}
          path: simple_live_app/build/linux/x64/release/*.zip
          if-no-files-found: error

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" simple_live_app/build/linux/x64/release/*.zip --clobber

  # ---------------------------------------------------------------- macOS
  build-macos:
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          V=$(grep -m1 '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=${V:-dev}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: 打开 macOS 桌面支持
        run: flutter config --enable-macos-desktop

      - name: 拉依赖
        run: |
          cd simple_live_app
          flutter pub get

      - name: 构建 macOS
        run: |
          cd simple_live_app
          flutter build macos --release

      - name: 打包为 zip（-y 保留符号链接，否则 .app 会损坏）
        run: |
          cd simple_live_app/build/macos/Build/Products/Release
          zip -q -r -y "SimpleLive-${{ steps.version.outputs.VERSION }}-macos-arm64.zip" *.app

      - name: 上传 macOS（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.version.outputs.VERSION }}
          path: simple_live_app/build/macos/Build/Products/Release/*.zip
          if-no-files-found: error

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" simple_live_app/build/macos/Build/Products/Release/*.zip --clobber

  # ---------------------------------------------------------------- iOS
  build-ios:
    if: ${{ github.event_name == 'push' || inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          V=$(grep -m1 '^version:' simple_live_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=${V:-dev}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: 拉依赖
        run: |
          cd simple_live_app
          flutter pub get

      - name: 构建 iOS（不签名）
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      - name: 打包为未签名 ipa
        run: |
          cd simple_live_app/build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -q -r -y "SimpleLive-${{ steps.version.outputs.VERSION }}-ios-no-sign.ipa" Payload

      - name: 上传 iOS（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ steps.version.outputs.VERSION }}
          path: simple_live_app/build/ios/iphoneos/*.ipa
          if-no-files-found: error

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" simple_live_app/build/ios/iphoneos/*.ipa --clobber
